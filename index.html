<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="project-container">
        <h1>Conversor JS (BRL para USD/EUR)</h1>
        <label for="valorBRL">Valor em R$ (Ex: 1543.50):</label>
        <input type="number" id="valorBRL" placeholder="Digite o valor" value="1543.50">
        
        <button id="converterBtn">Converter</button>

        <section id="resultados">
            <h2>Resultados da Conversão</h2>
            <p><strong>Valor original (String com 2 casas):</strong> <span id="resultadoFixed">--</span></p>
            <p><strong>Em Dólar (USD):</strong> <span id="resultadoUSD">--</span></p>
            <p><strong>Em Euro (€):</strong> <span id="resultadoEUR">--</span></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
